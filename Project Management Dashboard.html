<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Management Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F3F5FB;--card:#fff;--ink:#1B2340;--mute:#6A7391;--line:#E3E7F2;--accent:#4F5BD5;--done:#14A37F;--prog:#F4A62A;--todo:#7C8FE8;--warn:#E5484D;--track:#EDF0F8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1426;--card:#171E36;--ink:#EDF0FA;--mute:#9AA4C6;--line:#262F4D;--accent:#8C97FF;--done:#33C9A0;--prog:#F7BC5A;--todo:#8FA0F5;--track:#222B49}}
:root[data-theme="dark"]{--bg:#0F1426;--card:#171E36;--ink:#EDF0FA;--mute:#9AA4C6;--line:#262F4D;--accent:#8C97FF;--done:#33C9A0;--prog:#F7BC5A;--todo:#8FA0F5;--track:#222B49}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin-top:2px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600}
.kpis{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ring{display:flex;align-items:center;gap:16px}
.donut{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut i{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:20px}
.k{cursor:pointer;text-align:left;border-top:5px solid var(--c);transition:transform .15s}
.k:hover{transform:translateY(-2px)}.k[aria-pressed=true]{background:color-mix(in srgb,var(--c) 12%,var(--card));border-color:var(--c)}
.k b{display:block;font-size:34px;line-height:1.1;font-weight:800;color:var(--c)}
.lbl{color:var(--mute);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px}
.bar select,.bar input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px}
.tabs{margin-left:auto;display:flex;background:var(--track);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,70,.15)}
.grid{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
h2{font-size:15px;margin:0 0 12px;font-weight:700}
.scroll{overflow-x:auto}
.gantt{min-width:720px}
.gh,.gr{display:grid;grid-template-columns:210px 1fr;align-items:center}
.months{position:relative;height:24px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:600;font-size:12px}
.months span{position:absolute;top:2px;padding-left:6px;border-left:1px solid var(--line);height:22px}
.grp{background:var(--track);border-radius:8px;margin:10px 0 2px;padding:4px 10px;font-weight:700;display:flex;justify-content:space-between}
.grp small{color:var(--mute);font-weight:600}
.gr{min-height:34px}.gr .nm{padding:4px 10px 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gr .nm small{color:var(--mute);margin-left:6px}
.trk{position:relative;height:34px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.bk{position:absolute;top:8px;height:18px;border-radius:9px;background:color-mix(in srgb,var(--c) 28%,var(--card));border:1.5px solid var(--c);overflow:hidden;min-width:8px}
.bk i{display:block;height:100%;background:var(--c)}
.bk.w{border-style:dashed}
.pl{display:grid;gap:10px}
.pl button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 6px;border-radius:8px;cursor:pointer}
.pl button:hover,.pl button[aria-pressed=true]{background:var(--track)}
.pl .r{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.pt{height:8px;border-radius:4px;background:var(--track);overflow:hidden}.pt i{display:block;height:100%;border-radius:4px;background:var(--c)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;cursor:pointer}td.n{text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:12px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--card))}
.warn{color:var(--warn);font-weight:700;cursor:help}
.empty{padding:28px;text-align:center;color:var(--mute)}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.kpis>.card:first-child{grid-column:1/-1}.grid{grid-template-columns:1fr}.tabs{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="wrap">
<header><div><h1>Project Management Dashboard</h1><div class="sub" id="sub"></div></div><button class="theme" id="theme" type="button">Dark mode</button></header>
<section class="kpis" id="kpis" aria-label="Summary"></section>
<div class="bar">
<select id="proj" aria-label="Project"></select>
<input id="q" type="search" placeholder="Search task or person" aria-label="Search task or person">
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-v="t">Timeline</button><button role="tab" aria-selected="false" data-v="d">Table</button></div>
</div>
<div class="grid"><div class="card scroll" id="main"></div>
<aside class="card"><h2>Progress by project</h2><div class="pl" id="pl"></div></aside></div>
</div>

"2024-01-06", 20, "2024-01-26", 0.78], ["Sales", "Contract Negotiation", "Yvette", "2024-02-03", 35, "2024-03-09", 0.0], ["Support", "Technical Support", "Zoe", "2024-01-01", 25, "2024-01-26", 1.0], ["Support", "Bug Fixes", "Aaron", "2024-01-27", 31, "2024-02-27", 1.0], ["Support", "Software Updates", "Bella", "2024-03-02", 22, "2024-03-24", 0.0], ["Operations", "Process Optimization", "Calvin", "2024-01-03", 30, "2024-02-02", 0.4], ["Operations", "Inventory Management", "Diane", "2024-02-03", 25, "2024-02-28", 0.0], ["Operations", "Facility Maintenance", "Edward", "2024-02-29", 20, "2024-03-20", 0.0], ["Consulting", "Strategic Planning", "Fiona", "2024-01-02", 35, "2024-02-06", 0.6], ["Consulting", "Market Expansion", "Gary", "2024-02-02", 32, "2024-03-05", 0.0], ["Consulting", "Client Advisory", "Helen", "2024-03-06", 25, "2024-03-31", 0.0], ["Training", "Employee Training", "Isaac", "2024-01-04", 27, "2024-01-31", 0.8], ["Training", "Certification Programs", "Jane", "2024-01-28", 30, "2024-02-27", 0.0], ["Training", "Skill Development", "Kyle", "2024-02-28", 22, "2024-03-21", 0.0], ["Events", "Event Planning", "Laura", "2024-01-03", 25, "2024-01-28", 0.3], ["Events", "Conference Management", "Mike", "2024-02-03", 20, "2024-02-23", 0.0], ["Events", "Sponsorship Coordinatio", "n Nancy", "2024-02-24", 35, "2024-03-30", 0.0], ["Logistics", "Supply Chain Management", "Oscar", "2024-01-03", 25, "2024-01-28", 0.5], ["Logistics", "Transportation Planning", "Patricia", "2024-01-29", 30, "2024-02-28", 1.0], ["Logistics", "Inventory Optimization", "Quentin", "2024-03-29", 20, "2024-04-18", 0.0], ["Engineering", "Product Design", "Rachel", "2024-01-02", 25, "2024-01-27", 0.2], ["Engineering", "System Integration", "Sam", "2024-02-02", 22, "2024-02-24", 0.0], ["Engineering", "Prototype Testing", "Tom", "2024-02-23", 27, "2024-03-21", 0.0]]</script>
<script>
const R=JSON.parse(document.getElementById('data').textContent).map(r=>({p:r[0],t:r[1],a:r[2],s:r[3],d:r[4],e:r[5],g:r[6]}));
const $=id=>document.getElementById(id);
const ST={done:{n:'Complete',c:'var(--done)'},prog:{n:'In progress',c:'var(--prog)'},todo:{n:'Not started',c:'var(--todo)'}};
const stat=g=>g>=1?'done':g>0?'prog':'todo';
const D=s=>new Date(s+'T00:00:00Z').getTime()/864e5;
const fd=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pc=g=>Math.round(g*100)+'%';
const MIN=Math.min(...R.map(r=>D(r.s))),MAX=Math.max(...R.map(r=>D(r.e))),SPAN=MAX-MIN;
$('sub').textContent=R.length+' tasks across '+new Set(R.map(r=>r.p)).size+' projects, '+fd(R.find(r=>D(r.s)===MIN).s)+' to '+fd(R.find(r=>D(r.e)===MAX).e)+', 2024';
let F={proj:'',st:'',q:'',view:'t'};
const projs=[...new Set(R.map(r=>r.p))];
$('proj').innerHTML='<option value="">All projects</option>'+projs.map(p=>`<option>${esc(p)}</option>`).join('');
$('proj').onchange=e=>{F.proj=e.target.value;draw()};
$('q').oninput=e=>{F.q=e.target.value.toLowerCase();draw()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{F.view=b.dataset.v;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));draw()});
$('theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0F1426';d.dataset.theme=dark?'light':'dark';$('theme').textContent=dark?'Dark mode':'Light mode'};
const base=()=>R.filter(r=>(!F.proj||r.p===F.proj)&&(!F.q||(r.t+' '+r.a).toLowerCase().includes(F.q)));
function draw(){
 const b=base(),rows=b.filter(r=>!F.st||stat(r.g)===F.st);
 const cnt={done:0,prog:0,todo:0};b.forEach(r=>cnt[stat(r.g)]++);
 const avg=b.length?b.reduce((a,r)=>a+r.g,0)/b.length:0,n=b.length||1;
 const d1=cnt.done/n*100,d2=d1+cnt.prog/n*100;
 let h=`<div class="card ring"><div class="donut" style="background:conic-gradient(var(--done) 0 ${d1}%,var(--prog) ${d1}% ${d2}%,var(--todo) ${d2}% 100%)"><i>${pc(avg)}</i></div><div><div class="lbl">Average progress</div><div><b style="font-size:18px">${b.length}</b> tasks in view</div></div></div>`;
 for(const k in ST)h+=`<button class="card k" style="--c:${ST[k].c}" data-s="${k}" aria-pressed="${F.st===k}"><b>${cnt[k]}</b><span class="lbl">${ST[k].n}</span></button>`;
 $('kpis').innerHTML=h;
 $('kpis').querySelectorAll('.k').forEach(x=>x.onclick=()=>{F.st=F.st===x.dataset.s?'':x.dataset.s;draw()});
 // project list
 const pa=projs.map(p=>{const x=R.filter(r=>r.p===p);return{p,g:x.reduce((a,r)=>a+r.g,0)/x.length}}).sort((a,b)=>b.g-a.g);
 $('pl').innerHTML=pa.map(o=>{const s=o.g>=.6?'done':o.g>=.25?'prog':'todo';return`<button type="button" data-p="${esc(o.p)}" aria-pressed="${F.proj===o.p}" style="--c:${ST[s].c}"><div class="r"><span>${esc(o.p)}</span><span>${pc(o.g)}</span></div><div class="pt"><i style="width:${o.g*100}%"></i></div></button>`}).join('');
 $('pl').querySelectorAll('button').forEach(x=>x.onclick=()=>{F.proj=F.proj===x.dataset.p?'':x.dataset.p;$('proj').value=F.proj;draw()});
 if(!rows.length){$('main').innerHTML='<div class="empty">No tasks match these filters. Clear the search or pick another status.</div>';return}
 $('main').innerHTML=F.view==='t'?gantt(rows):table(rows);
}
function gantt(rows){
 const ms=[['Jan',0],['Feb',31],['Mar',60],['Apr',91]].map(([m,o])=>`<span style="left:${(D('2024-01-01')+o-MIN)/SPAN*100}%">${m}</span>`).join('');
 let h=`<div class="gantt"><div class="gh"><div></div><div class="months">${ms}</div></div>`;
 [...new Set(rows.map(r=>r.p))].forEach(p=>{
  const x=rows.filter(r=>r.p===p),a=x.reduce((s,r)=>s+r.g,0)/x.length;
  h+=`<div class="grp"><span>${esc(p)}</span><small>${pc(a)} complete</small></div>`;
  x.forEach(r=>{const bad=D(r.e)<D(r.s),l=(D(r.s)-MIN)/SPAN*100,w=Math.max(Math.abs(D(r.e)-D(r.s)),2)/SPAN*100,s=ST[stat(r.g)];
   h+=`<div class="gr"><div class="nm" title="${esc(r.t)}">${esc(r.t)}<small>${esc(r.a)}</small></div><div class="trk"><div class="bk ${bad?'w':''}" style="--c:${s.c};left:${l}%;width:${w}%" title="${esc(r.t)}: ${fd(r.s)} to ${fd(r.e)}, ${pc(r.g)} done${bad?' (end date is before start date)':''}"><i style="width:${r.g*100}%"></i></div></div></div>`});
 });
 return h+'</div>'}
function table(rows){
 let h='<table><thead><tr><th>Project</th><th>Task</th><th>Assigned to</th><th>Start</th><th>End</th><th class="n">Days</th><th>Status</th><th>Progress</th></tr></thead><tbody>';
 rows.forEach(r=>{const s=ST[stat(r.g)],bad=D(r.e)<D(r.s);
  h+=`<tr><td>${esc(r.p)}</td><td>${esc(r.t)}</td><td>${esc(r.a)}</td><td>${fd(r.s)}</td><td>${fd(r.e)}${bad?' <span class="warn" title="End date is before start date">!</span>':''}</td><td class="n">${r.d}</td><td><span class="pill" style="--c:${s.c}">${s.n}</span></td><td style="min-width:130px"><div class="pt" style="--c:${s.c}"><i style="width:${r.g*100}%"></i></div></td></tr>`});
 return'<div class="scroll">'+h+'</tbody></table></div>'}
draw();
</script></body></html>
